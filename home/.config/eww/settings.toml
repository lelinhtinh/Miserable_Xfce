# Personal settings for Miserable Xfce. See docs/settings.md.
[storage]
data_path = "/mnt/data"
data_label = "Data"
sidebar_path = "~"

[weather]
location = "Hoà Xuân, Đà Nẵng"
latitude = 16.00495
longitude = 108.22045
timezone = "Asia/Ho_Chi_Minh"
refresh_seconds = 900

[network]
ping_host = "1.1.1.1"

[desktop]
wallpaper = "~/.local/share/backgrounds/desinight_by_smn_paike.png"
panel_height = 46
browser = "google-chrome"
terminal = "xfce4-terminal"
pinned_apps = ["com.microsoft.VSCode", "xfce4-terminal", "google-chrome"]
store_command = ["pamac-manager"]

# Names from xrandr --query. The virtual output must already exist.
[display]
physical_output = "DP-4"
virtual_output = "HDMI-0"
virtual_mode = "1920x1080"
virtual_rate = "60"

physical_at_login = true
# Only used by scripts/render_restore.py, never installed by normal --apply.
nvidia_bus_id = "PCI:1:0:0"
nvidia_physical = "DFP-5"
nvidia_virtual = "DFP-0"

[restore]
nvidia_virtual_display = true
lotus_server = true
pulse_codec_filter = true
wireplumber_video_only = true
dac_volume = true
alsa_card = "GEW1"
alsa_control = "PCM"
