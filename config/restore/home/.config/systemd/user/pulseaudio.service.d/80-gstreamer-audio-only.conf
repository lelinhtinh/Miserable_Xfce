# PulseAudio uses GStreamer for its aptX/LDAC Bluetooth codecs.
# Avoid probing unrelated video/display plugins during session startup.
# Keep this filtered registry separate from the desktop's full plugin cache.
[Service]
Environment="GST_PLUGIN_LOADING_WHITELIST=coreelements,app,openaptx,ldac"
Environment="GST_REGISTRY=%h/.cache/gstreamer-1.0/registry-pulseaudio-audio-only.bin"
