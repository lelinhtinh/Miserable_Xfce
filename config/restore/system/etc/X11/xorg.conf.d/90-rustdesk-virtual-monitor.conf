# Virtual HDMI monitor for RustDesk; physical @PHYSICAL_OUTPUT@ remains active initially.
Section "Device"
    Identifier "RustDeskNvidia"
    Driver "nvidia"
    BusID "@NVIDIA_BUS_ID@"
    Option "ConnectedMonitor" "@NVIDIA_PHYSICAL@, @NVIDIA_VIRTUAL@"
    Option "CustomEDID" "@NVIDIA_VIRTUAL@:/usr/share/rustdesk-virtual-display/monitor.edid"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "MetaModes" "@PHYSICAL_OUTPUT@: nvidia-auto-select +0+0"
EndSection
